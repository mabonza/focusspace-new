name: focus-space-prod

# Production deployment
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  # ── MySQL database ────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: focus-space-db
    restart: always
    environment:
      MYSQL_DATABASE:      ${DATABASE_NAME:-focusspace}
      MYSQL_USER:          ${DATABASE_USERNAME:-strapi}
      MYSQL_PASSWORD:      ${DATABASE_PASSWORD:-strapi}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - focus-space
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Strapi backend (production build) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focus-space-backend
    restart: always
    env_file: ./backend/.env.production
    environment:
      NODE_ENV:          production
      DATABASE_CLIENT:   mysql
      DATABASE_HOST:     db
      DATABASE_PORT:     3306
      DATABASE_NAME:     ${DATABASE_NAME:-focusspace}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    ports:
      - "1337:1337"
    volumes:
      - strapi-uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - focus-space

  # ── React frontend (nginx, production build) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STRAPI_URL: ${VITE_STRAPI_URL:-http://localhost:1337}
    container_name: focus-space-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - focus-space

networks:
  focus-space:
    driver: bridge

volumes:
  mysql-data:
  strapi-uploads:
