name: focus-space-prod

# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or standalone (everything self-contained):
#   docker compose -f docker-compose.prod.yml up -d

services:
  # ── PostgreSQL database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: focus-space-db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-focusspace}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - focus-space
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Strapi backend (production) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focus-space-backend
    restart: always
    env_file: ./backend/.env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-focusspace}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      NODE_ENV: production
    ports:
      - "1337:1337"
    volumes:
      - strapi-uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - focus-space
    command: ["npm", "run", "start"]

  # ── React frontend (nginx, production build) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In prod, the browser talks to the backend via its public URL
        VITE_STRAPI_URL: ${VITE_STRAPI_URL:-http://localhost:1337}
    container_name: focus-space-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - focus-space

networks:
  focus-space:
    driver: bridge

volumes:
  pg-data:
  strapi-uploads:
